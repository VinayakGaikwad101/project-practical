services:
  mongodb:
    image: mongo:7.0
    container_name: ai_editor_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ai_document_editor

  redis:
    image: redis:7.2-alpine
    container_name: ai_editor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
    name: ai_editor_mongodb_data
  redis_data:
    name: ai_editor_redis_data
